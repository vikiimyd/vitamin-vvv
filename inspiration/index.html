<style>
:root { --paper: #ffffff; --ink: #141414; --grey: #8c8c8c; color-scheme: light; }

* { box-sizing: border-box; }
body.lock { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; background: var(--paper); color: var(--ink); font-family: "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", Arial, sans-serif; }
.lock form { display: grid; gap: 16px; width: min(300px, 100%); text-align: center; }
.lock .wm { font-weight: 500; font-size: 17px; letter-spacing: .42em; padding-left: .42em; text-transform: uppercase; white-space: nowrap; margin-bottom: 10px; }
.lock input { font: inherit; font-size: 16px; color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--ink); border-radius: 0; padding: 8px 0; text-align: center; letter-spacing: .1em; }
.lock input:focus { outline: none; border-bottom-width: 2px; }
.lock button { font: inherit; font-size: 13px; letter-spacing: .1em; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); padding: 11px; cursor: pointer; }
.lock button:disabled { opacity: .5; cursor: default; }
.lock .m { min-height: 1.5em; margin: 0; font-size: 12px; color: var(--grey); }
</style>
