<style>
:root { --paper: #ffffff; --ink: #141414; --grey: #8c8c8c; color-scheme: light; }

* { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; background: var(--paper); color: var(--ink); font-family: "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", Arial, sans-serif; }
form { display: grid; gap: 16px; width: min(300px, 100%); text-align: center; }
.wm { font-weight: 500; font-size: 17px; letter-spacing: .42em; padding-left: .42em; text-transform: uppercase; white-space: nowrap; margin-bottom: 10px; }
input { font: inherit; font-size: 16px; color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--ink); border-radius: 0; padding: 8px 0; text-align: center; letter-spacing: .1em; }
input:focus { outline: none; border-bottom-width: 2px; }
button { font: inherit; font-size: 13px; letter-spacing: .1em; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); padding: 11px; cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
.m { min-height: 1.5em; margin: 0; font-size: 12px; color: var(--grey); }
</style>

  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: d.subarray(0, 12) }, k, d.subarray(12)));
  keep.set(to64(raw));
  document.open(); document.write(html.replace("__VVVK__", to64(raw))); document.close();
}
async function derive(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64(SALT), iterations: ITER }, base, 256));
}
const f = document.getElementById("f"), m = document.getElementById("m"), go = document.getElementById("go"), p = document.getElementById("p");
f.addEventListener("submit", async e => {
  e.preventDefault(); if (!p.value) return;
  go.disabled = true; m.textContent = "打开中… Opening…";
  try { await unlock(await derive(p.value)); }
  catch (err) { go.disabled = false; m.textContent = window.crypto?.subtle ? "密码不对，再试一次。Wrong password." : "这个浏览器打不开，换 Safari 或 Chrome 试试。"; p.select(); }
});
(async () => {
  const k = keep.get();
  if (k) { try { await unlock(b64(k)); return; } catch (e) { keep.set(null); } }
  f.hidden = false; p.focus();
})();
