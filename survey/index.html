<style>

:root {
  --white: #ffffff;
  --ink: #141414;

}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--white); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.55; margin: 0; display: flex; flex-direction: column; }
.up { text-transform: uppercase; letter-spacing: 0.14em; font-size: 10.5px; }
header { border-bottom: 1px solid var(--hair); padding-block: 22px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
header .l { color: var(--grey); }

.wordmark { font-weight: 500; font-size: 17px; letter-spacing: 0.42em; text-transform: uppercase; padding-left: 0.42em; white-space: nowrap; }
@media (max-width: 420px) { .wordmark { font-size: 14px; letter-spacing: 0.28em; padding-left: 0.28em; } header .l, header .r { font-size: 9px; letter-spacing: 0.1em; } }
.preview { background: var(--soft); color: var(--grey); text-align: center; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

p { margin: 0; color: #3c3c3c; max-width: 60ch; }

@keyframes plop { from { transform: translateY(-10px) scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }

.nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 8px; }

.flower-wrap { display: inline-block; line-height: 0; flex: none; }
.flower { overflow: visible; display: block; }
.flower .drop { display: none; }
.wordmark { animation: rise 1s ease both; }

.hero { display: flex; flex-direction: column; gap: 16px; }

.process { margin: 28px 0 0; animation: rise .9s ease .25s both; }

.ph-process { width: 124px; aspect-ratio: 3 / 4; flex: none; background: #ececea; display: flex; align-items: center; justify-content: center; text-align: center; padding: 8px; color: #a6a6a6; font-size: 9.5px; text-transform: uppercase; letter-spacing: .14em; }
.hero .flower-wrap { animation: rise .9s ease both, dip 4s ease-in-out 1s infinite; }

.story { border: 1px solid var(--ink); background: var(--white); padding: 22px 20px; display: grid; gap: 14px; }
.story-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }

.vig { height: 72px; margin-bottom: -6px; line-height: 0; }

@keyframes vg-wave { 0%, 62%, 100% { transform: none; } 12%, 36% { transform: rotate(14deg); } 24%, 48% { transform: rotate(-8deg); } }

.opt[data-ic] { justify-content: flex-start; }

const has = (a, k, v) => (a[k] || []).includes(v);
const NIGHT = "Nights out (party, dinner, date, club)";
const CONCERT = "Concerts or festivals";
const NONE = ["None of these", "Nothing really"];
const occ = a => { const d = a.dress || []; return d.length === 1 ? d[0] : d.includes(a.focus) ? a.focus : null; };
const occLabel = a => { const o = occ(a); return o === "Other" ? ((a.dress_other || "").trim() || t("Other")) : o ? t(o) : ""; };

const UMB = "Got wet even with an umbrella (strong wind, sideways rain, or sharing one)";
const HOOD = "I put my hood up for the rain, and it dripped onto my face or blocked my view";
const COAT = "I put on a coat or jacket for the rain, and it hid my outfit or didn't go with it";
const ONWAY = [UMB, "Couldn't hold an umbrella properly (riding a bike, hands full, using my phone)", "Shoes or hem got wet or dirty", "Hair or makeup got messed up", "My bag or things got wet", HOOD, "Had to wait longer or pay more for a taxi", COAT, "None of these", "Other"];
const onwayOpts = a => ONWAY.filter(o =>
  o === UMB ? has(a, "did", "Used an umbrella") :
  o === HOOD ? has(a, "did", "Wore a hat or hood") || has(a, "did", "Wore a raincoat or waterproof jacket") :
  o === COAT ? has(a, "did", "Wore a raincoat or waterproof jacket") || has(a, "did", "Wore my usual coat") : true);
const JOURNEY = ["before", "onway", "arrive"];
const rankOpts = a => JOURNEY.flatMap(k => (a[k] || []).filter(v => !NONE.includes(v)).map(v => v === "Other" ? "Other@" + k : v));
const P = (part, qs) => qs.map(x => ({ ...x, part }));
const Q = [
  ...P("About you", [
