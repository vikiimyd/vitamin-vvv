<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>22 Brand Bestsellers</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..500&family=Jost:wght@400;500;600&display=swap">
<style>
body { margin: 0; } img { max-width: 100%; }
/* Layout: same runway-grey world as the lookbook; a sticky tab bar, then one wide brand × style grid per tab (brand column pinned left, scrolls sideways inside its own box). */
:root {
  --paper: #edefee;
  --plate: #ffffff;
  --card: #f9faf9;
  --ink: #16191b;
  --muted: #5d656b;
  --faint: #a3abaf;
  --line: #d0d6d5;
  --accent: #3b6176;
  --accent-soft: #d9e4ea;
  --plum: #7a4b64;
  --plum-soft: #eee1e8;
  --display: "Bodoni Moda", "Bodoni 72", Didot, Georgia, serif;
  --ui: "Jost", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131617; --plate: #f2f3f2; --card: #191d1f; --ink: #eceeed; --muted: #9aa3a8; --faint: #5f686d;
    --line: #2d3336; --accent: #8fb3c6; --accent-soft: #22323b; --plum: #d3a3bc; --plum-soft: #3a2631; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #131617; --plate: #f2f3f2; --card: #191d1f; --ink: #eceeed; --muted: #9aa3a8; --faint: #5f686d;
  --line: #2d3336; --accent: #8fb3c6; --accent-soft: #22323b; --plum: #d3a3bc; --plum-soft: #3a2631; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--ui); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.wrap { max-width: 1400px; margin: 0 auto; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { padding-block: 40px 18px; display: grid; gap: 10px; }
.eyebrow { margin: 0; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
h1 { margin: 0; font-family: var(--display); font-style: italic; font-weight: 400; font-size: clamp(2.4rem, 7vw, 4.4rem); line-height: 1; letter-spacing: -.01em; text-wrap: balance; }
.lede { margin: 6px 0 0; max-width: 64ch; color: var(--muted); }
.notes { max-width: 72ch; }
.notes summary { cursor: pointer; font-size: 13px; color: var(--accent); font-weight: 500; width: max-content; }
.notes ul { margin: 8px 0 0; padding-left: 18px; color: var(--muted); font-size: 14px; display: grid; gap: 4px; }

.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--paper); border-bottom: 1px solid var(--line); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tab { border: 0; background: none; padding: 14px 14px 12px; font-weight: 500; font-size: 15px; color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.tab small { font-size: 12px; color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }

main { padding-block: 20px 60px; }
.panel { display: grid; gap: 14px; }
.hint { margin: 0; font-size: 13px; color: var(--muted); max-width: 72ch; }

/* grid table */
.scroller { overflow-x: auto; border-top: 1px solid var(--ink); -webkit-overflow-scrolling: touch; }
table { border-collapse: separate; border-spacing: 0; font-size: 13px; }
th, td { vertical-align: top; text-align: left; border-bottom: 1px solid var(--line); padding: 10px 8px; }
thead th { position: sticky; top: 0; background: var(--paper); font-weight: 500; z-index: 2; }
thead th .lab { display: block; font-size: 14px; color: var(--ink); white-space: nowrap; }
thead th .cnt { display: block; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
thead th .bar { display: block; height: 3px; background: var(--accent); margin-top: 6px; }
.bcol { position: sticky; left: 0; z-index: 1; background: var(--paper); width: 150px; min-width: 150px; max-width: 150px; border-right: 1px solid var(--line); }
thead .bcol { z-index: 3; }
.bname { font-family: var(--display); font-weight: 500; font-size: 1.15rem; line-height: 1.15; display: block; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.chip { font-size: 11.5px; padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip.v { background: var(--plum-soft); color: var(--plum); }
.chip.z { background: none; color: var(--faint); padding-inline: 0; }
.src { display: block; margin-top: 6px; font-size: 11.5px; line-height: 1.35; color: var(--muted); font-weight: 400; }
.ov .item, .ov .item .ph, .ov .others { width: 176px; }
.ov td { padding-inline: 12px; }
.seg { display: inline-flex; border: 1px solid var(--ink); width: max-content; margin-top: 4px; }
.seg button { border: 0; background: none; padding: 7px 18px; font-size: 14px; font-weight: 500; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.item .det { font-size: 11.5px; color: var(--accent); line-height: 1.35; }
.sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 28px; padding-block: 4px 10px; }
.sumh { grid-column: 1 / -1; margin: 0; font-size: 14px; font-weight: 500; }
.sumg { display: grid; gap: 5px; align-content: start; min-width: 0; }
.sumg h3 { margin: 0 0 2px; font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 500; }
.brow { display: grid; grid-template-columns: 7.5em minmax(0, 1fr) 2em; gap: 8px; align-items: center; font-size: 13px; }
.brow span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brow i { display: block; height: 8px; background: var(--accent); min-width: 2px; }
.brow b { font-weight: 500; font-variant-numeric: tabular-nums; text-align: right; }
.rank { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

.item { display: grid; gap: 4px; width: 128px; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; }
.item .ph { position: relative; width: 128px; aspect-ratio: 3 / 4; max-width: 100%; background: var(--plate); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.item .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.item .ph .n { position: absolute; left: 0; top: 0; background: var(--ink); color: var(--paper); font-size: 11px; padding: 1px 6px; font-variant-numeric: tabular-nums; }
.item .st { font-size: 13px; font-weight: 500; color: var(--ink); }
.item .nm { font-size: 12px; color: var(--muted); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item:hover .ph { outline: 1px solid var(--ink); }
.cellstack { display: grid; gap: 6px; }
.others { display: flex; flex-wrap: wrap; gap: 3px; width: 128px; }
.others span { font-size: 11px; color: var(--muted); border: 1px solid var(--line); padding: 0 5px; }
.none { color: var(--faint); font-size: 12px; width: 96px; }
td.empty { background: transparent; }

.foot { color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); padding-top: 14px; margin-top: 18px; max-width: 80ch; }

dialog#lb { border: 0; padding: 0; background: var(--card); color: var(--ink); width: min(900px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); }
dialog#lb::backdrop { background: rgba(10, 12, 13, .72); }
.lbi { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.lbi .big { background: var(--plate); display: flex; align-items: center; justify-content: center; max-height: calc(100dvh - 24px); }
.lbi .big img { height: min(calc(100dvh - 24px), 600px); aspect-ratio: 3 / 4; width: auto; max-width: 100%; object-fit: cover; }
.lbt { padding: 22px 20px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.lbt h4 { margin: 0; font-family: var(--display); font-weight: 500; font-size: 1.5rem; line-height: 1.15; }
.lbt .row { display: grid; grid-template-columns: 3.4em minmax(0, 1fr); gap: 8px; align-items: baseline; font-size: 14px; overflow-wrap: anywhere; }
.lbt .row > span { font-size: 12px; color: var(--muted); }
.lbnav { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.lbnav button, .lbnav a { border: 1px solid var(--line); background: none; padding: 6px 12px; font-size: 13px; cursor: pointer; text-decoration: none; }
.lbnav button:hover, .lbnav a:hover { border-color: var(--ink); }
.lbnav .x { margin-left: auto; }
@media (max-width: 720px) {
  .lbi { grid-template-columns: 1fr; }
  .lbi .big img { height: 52dvh; }
  .lbi .big { max-height: none; }
  dialog#lb { overflow-y: auto; }
  .bcol { width: 112px; min-width: 112px; max-width: 112px; }
  .bname { font-size: 1rem; }
  .item, .item .ph, .others, .ov .item, .ov .item .ph, .ov .others { width: 104px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>

<div class="wrap">
  <header class="top">
    <p class="eyebrow">品牌二十选 · 外套 / 帽子 / 上装 / 下装</p>
    <h1>22 Brand Bestsellers</h1>

        <button class="x" id="lbx" type="button">关闭</button>
      </div>
    </div>
  </div>
</dialog>

collections/accessories-sale-ss26?sort_by=best-selling). Line: Martine Rose mainline SS26 (newest mainline season in the store; no AW26 mainline listed yet). Now 50% off in the store's end-of-season sale (rank reflects units sold, incl. any earlier full-price sales). In stock (one size).", "evidence_url": "https://www.martine-rose.com/collections/all?sort_by=best-selling", "length": "", "hood": "", "material": ""}, {"rank": 5, "name": "CUT PEAK CAP in WASHED BLACK", "style": "baseball_cap", "style_note": "", "price": "£202", "url": "https://www.martine-rose.com/products/cut-peak-cap-in-washed-black-ss26", "file": "img/men/martine-rose/hat.jpg?v=8e385350", "si": 4, "sn": 6, "evidence": "martine-rose.com (the brand's own UK Shopify store, GBP prices). The store has no men/women split (every piece is labelled 'can be worn by everyone'), so its line is treated as the men's line. Shop All (/collections/all, all 123 published products) sorted by the site's own 'Best selling' option (?sort_by=best-selling; the order differs from the Featured (A-Z) and newest orders) on 2026-10-19: style first appears at tile #80; rank counts only headwear, colourways of the same style merged. Line: Martine Rose mainline SS26 (newest mainline season in the store; no AW26 mainline listed yet). Full price. In stock (one size).", "evidence_url": "https://www.martine-rose.com/collections/all?sort_by=best-selling", "length": "", "hood": "", "material": ""}, {"rank": 6, "name": "SIGNATURE BUCKET HAT in WASHED BLACK", "style": "bucket_hat", "style_note": "", "price": "£85.50 (sale; was £171)", "url": "https://www.martine-rose.com/products/signature-bucket-hat-in-washed-black", "file": "img/men/martine-rose/hat.jpg?v=8e385350", "si": 5, "sn": 6, "evidence": "martine-rose.com (the brand's own UK Shopify store, GBP prices). The store has no men/women split (every piece is labelled 'can be worn by everyone'), so its line is treated as the men's line. Shop All (/collections/all, all 123 published products) sorted by the site's own 'Best selling' option (?sort_by=best-selling; the order differs from the Featured (A-Z) and newest orders) on 2026-10-19: style first appears at tile #103; rank counts only headwear, colourways of the same style merged. #6 in Sale Accessories (/collections/accessories-sale-ss26?sort_by=best-selling). Line: Martine Rose mainline SS26 (newest mainline season in the store; no AW26 mainline listed yet). Now 50% off in the store's end-of-season sale (rank reflects units sold, incl. any earlier full-price sales). In stock (one size).", "evidence_url": "https://www.martine-rose.com/collections/all?sort_by=best-selling", "length": "", "hood": "", "material": ""}]}, "none": {}}], "skipped": ["Chanel", "Miu Miu", "Brandy Melville", "With Jéan", "Alaïa", "COYSEIO", "Ashley Williams", "Chloé", "MARKGONG", "Phoebe Philo", "Tank Air"], "lede": "男装：22 个品牌里的 10 个男装线，加上你加的 Martine Rose 和问卷里被提到的 Buck Mason。排序和查法跟女装一样，每个品牌每类查男装卖得最好的前 6 件。（Claude 查的，2026-10-19）"}, "how": ["受欢迎程度 = 问卷「最喜欢的品牌」里被写到的次数（42 人填了这题）+ 访谈里被提到的次数。次数一样时，问卷多的在前。", "热卖名次优先用品牌官网的「Best sellers / 最受欢迎」排序；独立品牌的 Shopify 店用 best-selling 排序；都没有时用买手店的排序，或者媒体和品牌自己说的热卖款、经典款。每件点开都写了依据。", "外套只算品牌放在外套类里的：大衣、风衣、夹克、西装外套、马甲、斗篷等，按外套类自己的热卖排序。上装包括外套和上衣（衬衫、针织、T 恤、卫衣），所以外套也可能出现在上装里。下装包括裤子、牛仔裤、裙子、短裤。不含连衣裙。", "女装和男装分开查，各看各的热卖榜。图片是官网商品图，价格是查的那天官网写的。"], "foot": "数据：Google Sheet「Vitamin VVV 落地页回答」Survey 表（10/19 导出）、访谈记录、各品牌官网、买手店和公开报道。名次是 10/19 当天看到的，会变。"};
const CATS = [['outer', '外套'], ['hat', '帽子'], ['top', '上装'], ['bottom', '下装']];
const LEN = { cropped: '短款（腰以上）', hip: '到臀', thigh: '到大腿', knee: '到膝', long: '过膝长款' };
const LENS = { cropped: '短款', hip: '到臀', thigh: '到大腿', knee: '到膝', long: '长款' };
const det = it => [LENS[it.length], it.hood === true ? '有帽' : it.hood === false ? '无帽' : '', it.material].filter(Boolean).join(' · ');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const label = (cat, it) => it.style === 'other' && it.style_note ? it.style_note : (D.styles[cat][it.style] || it.style);
let items = [];
let G = 'women', TAB = 'all';
const B = () => D[G].brands;

function chips(b) {
  const out = [];
  if (b.survey) out.push(`<span class="chip">📝 问卷 ${b.survey}</span>`);
  if (b.interview) out.push(`<span class="chip">🎤 访谈 ${b.interview}</span>`);
  if (b.viki) out.push('<span class="chip v">💜 你列的</span>');
  if (b.nico) out.push('<span class="chip v">🥃 Nicolas 喜欢</span>');
  if (!b.survey && !b.interview && !b.nico) out.push('<span class="chip z">还没人提到</span>');
  return `<div class="chips">${out.join('')}</div>`;
}
function brandCell(b) { return `<th class="bcol" scope="row"><span class="bname">${esc(b.name)}</span>${chips(b)}${b.src ? `<span class="src">依据：${esc(b.src)}</span>` : ''}</th>`; }
function itemBtn(b, cat, it) {
  const i = items.push({ b, cat, it }) - 1;
  return `<button class="item" type="button" data-i="${i}"><span class="ph">${it.file ? `<img loading="lazy" src="${esc(it.file)}" style="object-position:${tile(it)} 0" alt="${esc(b.name + ' ' + it.name)}">` : ''}<span class="n">#${it.rank}</span></span><span class="st">${esc(label(cat, it))}</span>${cat === 'outer' && det(it) ? `<span class="det">${esc(det(it))}</span>` : ''}<span class="nm">${esc(it.name)}${it.price ? ' · ' + esc(it.price) : ''}</span></button>`;
}
function noneText(b, cat) { return `<div class="none">${esc((b.none && b.none[cat]) || '—')}</div>`; }

function overview() {
  const head = `<tr><th class="bcol">品牌 · 受欢迎程度</th>${CATS.map(([k, n]) => `<th><span class="lab">${n}</span><span class="cnt">卖得最好的那件</span></th>`).join('')}</tr>`;
  const rows = B().map(b => `<tr>${brandCell(b)}${CATS.map(([k]) => {
    const list = (b.items[k] || []).slice().sort((x, y) => x.rank - y.rank);
    if (!list.length) return `<td class="empty">${noneText(b, k)}</td>`;
    const rest = {};
    list.slice(1).forEach(it => { const l = label(k, it); rest[l] = (rest[l] || 0) + 1; });
    const others = Object.entries(rest).map(([l, n]) => `<span>${esc(l)}${n > 1 ? ' ×' + n : ''}</span>`).join('');
    return `<td><div class="cellstack">${itemBtn(b, k, list[0])}${others ? `<div class="others">${others}</div>` : ''}</div></td>`;
  }).join('')}</tr>`).join('');
  return `<p class="hint">每格是这个品牌这一类在热卖榜上排第一的单品。下面的小标签是它前 6 名里的其他款式，×2 表示有两件。点图片看大图和依据。</p><div class="scroller ov"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
}

function styleCols(cat) {
  const count = {};
  B().forEach(b => { const seen = new Set((b.items[cat] || []).map(it => it.style === 'other' ? 'other:' + (it.style_note || '') : it.style)); seen.forEach(s => count[s] = (count[s] || 0) + 1); });
  return Object.entries(count).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
}
function bars(title, rows) {
  const max = Math.max(1, ...rows.map(r => r[1]));
  return `<div class="sumg"><h3>${title}</h3>${rows.map(([l, n]) => `<div class="brow"><span>${esc(l)}</span><i style="width:${Math.round(n / max * 100)}%"></i><b>${n}</b></div>`).join('')}</div>`;
}
function outerSummary() {
  const all = B().flatMap(b => b.items.outer || []);
  if (!all.length) return '';
  const len = Object.keys(LEN).map(k => [LEN[k], all.filter(it => it.length === k).length]);
  const hood = [['有帽子', all.filter(it => it.hood === true).length], ['没有帽子', all.filter(it => it.hood === false).length]];
  const mc = {};
  all.forEach(it => { const m = (it.material_zh || it.material || '').trim(); if (m) mc[m] = (mc[m] || 0) + 1; });
  const mat = Object.entries(mc).sort((a, b) => b[1] - a[1]).slice(0, 7);
  const st = {};
  all.forEach(it => { const l = label('outer', it); st[l] = (st[l] || 0) + 1; });
  const sty = Object.entries(st).sort((a, b) => b[1] - a[1]).slice(0, 7);
  return `<div class="sum"><p class="sumh">${all.length} 件热卖外套（${B().filter(b => (b.items.outer || []).length).length} 个品牌）合起来看：</p>${bars('款式', sty)}${bars('长度', len)}${bars('帽子', hood)}${bars('面料', mat)}</div>`;
}
function catPanel(cat, name) {
  const cols = styleCols(cat);
  const max = cols.length ? cols[0][1] : 1;
  const key = it => it.style === 'other' ? 'other:' + (it.style_note || '') : it.style;
  const colName = k => k.startsWith('other:') ? (k.slice(6) || '其他') : (D.styles[cat][k] || k);
  const head = `<tr><th class="bcol">品牌 · 受欢迎程度</th>${cols.map(([k, n]) => `<th><span class="lab">${esc(colName(k))}</span><span class="cnt">${n} 个品牌</span><span class="bar" style="width:${Math.round(n / max * 100)}%"></span></th>`).join('')}</tr>`;
  const rows = B().map(b => {
    const list = b.items[cat] || [];
    return `<tr>${brandCell(b)}${cols.map(([k]) => {
      const hits = list.filter(it => key(it) === k).sort((x, y) => x.rank - y.rank);
      if (!hits.length) return '<td class="empty"></td>';
      const more = hits.length > 1 ? `<div class="rank">前 6 里共 ${hits.length} 件（#${hits.map(h => h.rank).join('、#')}）</div>` : '';
      return `<td><div class="cellstack">${itemBtn(b, cat, hits[0])}${more}</div></td>`;
    }).join('')}</tr>`;
  }).join('');
  const nobody = B().filter(b => !(b.items[cat] || []).length).map(b => `${b.name}（${b.none[cat]}）`);
  return `${cat === 'outer' ? outerSummary() : ''}<p class="hint">${name}按具体款式分开，列从左到右按「有几个品牌的前 6 名里有这个款式」排。每格放这个品牌这个款式里名次最高的一件。${nobody.length ? `这一类空着的品牌：${esc(nobody.join('、'))}。` : ''}</p><div class="scroller"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
}

function render() {
  items = [];
  $('#lede').textContent = D[G].lede;
  $('#how').innerHTML = D.how.map(t => `<li>${esc(t)}</li>`).join('');
  $('#foot').textContent = D.foot;
  document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x.dataset.g === G));
  const tabs = [['all', '总览', '']].concat(CATS.map(([k, n]) => [k, n, styleCols(k).length + ' 种款式']));
  $('#tabs').innerHTML = tabs.map(([k, n, s], i) => `<button class="tab" role="tab" id="t-${k}" aria-controls="p-${k}" aria-selected="${i === 0}" data-k="${k}">${n}${s ? `<small>${s}</small>` : ''}</button>`).join('');
  const skip = D[G].skipped && D[G].skipped.length ? `<p class="hint">没有男装线、所以不在这里的品牌：${esc(D[G].skipped.join('、'))}。</p>` : '';
  $('#main').innerHTML = tabs.map(([k, n], i) => `<section class="panel" role="tabpanel" id="p-${k}" aria-labelledby="t-${k}" ${i ? 'hidden' : ''}>${k === 'all' ? skip + overview() : catPanel(k, n)}</section>`).join('');
  show(TAB);
}
function show(k) {
  TAB = k;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.k === k));
  document.querySelectorAll('.panel').forEach(p => p.hidden = p.id !== 'p-' + k);
  try { history.replaceState(null, '', '#' + (G === 'men' ? 'm-' : '') + k); } catch (e) {}
}
// pictures come as one strip per brand and category; pick tile si of sn
const tile = it => it.sn > 1 ? (it.si / (it.sn - 1) * 100) + '%' : '50%';
function open(i) {
  const { b, cat, it } = items[i];
  $('#lbimg').src = it.file || ''; $('#lbimg').style.objectPosition = tile(it) + ' 0'; $('#lbimg').alt = b.name + ' ' + it.name;
  $('#lbbrand').textContent = b.name + ' · ' + CATS.find(c => c[0] === cat)[1];
  $('#lbname').textContent = it.name;
  $('#lbstyle').textContent = label(cat, it);
  $('#lbrank').textContent = `这个品牌${CATS.find(c => c[0] === cat)[1]}热卖榜第 ${it.rank} 名`;
  $('#lbprice').textContent = it.price || '没写';
  $('#lbdet-row').hidden = cat !== 'outer';
  $('#lbdet').textContent = cat === 'outer' ? [LEN[it.length] || '', it.hood === true ? '有帽子' : it.hood === false ? '没有帽子' : '', it.material || ''].filter(Boolean).join(' · ') : '';
  $('#lbev').textContent = it.evidence || '';
  $('#lburl').href = it.url || '#'; $('#lburl').hidden = !it.url;
  $('#lbevurl').href = it.evidence_url || '#'; $('#lbevurl').hidden = !it.evidence_url || it.evidence_url === it.url;
  $('#lb').showModal();
}
const h = (location.hash || '').slice(1);
if (h.startsWith('m-')) G = 'men';
const hk = h.replace(/^m-/, '');
if (['outer', 'hat', 'top', 'bottom'].includes(hk)) TAB = hk;
render();
document.addEventListener('click', e => {
  const g = e.target.closest('.seg button'); if (g) { if (g.dataset.g !== G) { G = g.dataset.g; render(); } return; }
  const t = e.target.closest('.tab'); if (t) return show(t.dataset.k);
  const it = e.target.closest('.item'); if (it) return open(+it.dataset.i);
  if (e.target.id === 'lbx' || e.target.id === 'lb') $('#lb').close();
});
</script>
